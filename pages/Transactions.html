<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="../css/Transactions.css">
  <script src="../js/Transaction.js" defer></script>
</head>
<body>
  <div class="expense-tracker">
        <div class="expense-tracker-header">
            <header>
                <div class="logo-section">
                    <img src="../img/logo.webp" alt="Expense Tracker Logo" class="logo">
                    <span class="title">Expense Tracker</span>
                </div>
                <div class="navigation">
                    <div class="nav-btn">
                        <img src="../img/Dashboard.png" alt="Dashboard Icon">
                        <a href="../pages/Dashboard.html">Dashboard</a>
                    </div>
                    <div class="nav-btn">
                        <img src="../img/Transaction.png" alt="Transactions Icon">
                        <a href="../pages/Transactions.html">Transactions</a>
                    </div>
                    <button class="logout-btn"><a href="../index.html">Logout</a></button>
                </div>
            </header>
        </div>

        <div class="date">
            <div class="card-date">
                <input type="month" id="month-year" name="month-year">
            </div>
        </div>
        <div class="money">
            <div class="total-money card-money">
                <div class="total">
                    <label for="total-money">Your Total Money</label>
                    <div class="btn-money">
                            <div class="number-money">$ 0</div>
                            <span>USD</span>
                    </div>
                </div>
            </div>
            <div class="total-salary-dollar card-money">
                <div class="total">
                    <label for="total-salary-dollar">Your Total Salary</label>
                    <div class="btn-money">
                        <div class="number-money">$ 0</div>
                        <span>USD</span>
                    </div>
                </div>
            </div>
            <div class="total-salary-khmer card-money">
                <div class="total">
                    <label for="total-salary-khmer">Your Total Salary</label>
                    <div class="btn-money">
                        <div class="number-money">$ 0</div>
                        <span>KHR</span>
                    </div>
                </div>
            </div>
            <div class="total-saving card-money">
                <div class="total">
                    <label for="total-saving">Your Total Saving</label>
                    <div class="btn-money">
                        <div class="number-money">$ 0</div>
                        <span>USD</span>
                    </div>
                </div>
            </div>
        </div>
        <div class="add-money">
            <div class="card-add-money">
                <div class="add">
                    <label for="add-money">Add Salary</label>
                    <button id="add-money">Add</button>
                    <button id="edit">Edit</button>
                </div>
            </div>
        </div>
        <div id="custom-modal" class="modal hidden">
            <div class="modal-content">
                <p id="modal-message">Enter your salary in USD:</p>
                <input type="number" id="modal-input" placeholder="0">
                <div class="modal-buttons">
                    <button id="modal-confirm">Confirm</button>
                    <button id="modal-cancel">Cancel</button>
                </div>
            </div>
        </div>
        <div class="experses">
            <h1>Expenses</h1>
            <div class="table-expenses">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Date</th>
                            <th>Category</th>
                            <th>Amount</th>
                            <th>Paid</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="expenses-table">
                        <!-- <tr>
                            <td>1</td>
                            <td>January 2025</td>
                            <td>Food</td>
                            <td>$100</td>
                            <td>
                                <input type="checkbox" name="paid" id="paid">
                            </td>
                            <td>
                                <button id="edit-expense">Edit</button>
                                <button id="delete-expense">Delete</button>
                            </td>
                        </tr> -->
    
                    </tbody>
                </table>
                <div class="all-total">
                    <div class="button-add-and-print">
                        <button id="add-expense">Add Expense</button>
                        <button id="print-pdf">Print PDF</button>
                    </div>
                    <div class="total-money-per-month">
                        <p>All Total:</p>
                        <div class="number-money">$ 0</div>
                        <span>USD</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="../js/Transaction.js"></script>
    <script src="../js/print.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</body>
</html>
