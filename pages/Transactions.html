<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="../css/Transactions.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <nav class="navigation">
    <div class="nav-left">
      <a href="profile.html" class="nav-link">
        <img src="../img/logo.webp" alt="logo" title="Profile">
        Expense Tracker
      </a>
    </div>
    <div class="nav-right">
      <a href="index.html" class="nav-link active">
        <i data-lucide="list"></i>
        Expenses
      </a>
      <a href="dashboard.html" class="nav-link">
        <i data-lucide="layout-dashboard"></i>
        Dashboard
      </a>
      <a href="logout.html" class="nav-link">
        <i data-lucide="log-out"></i>
        Logout
      </a>
    </div>
  </nav>
  <div class="container">
    <div class="content">

      <h1>Expenses Tracker</h1>
      
      <!-- Summary Cards -->
      <div class="summary-cards">
        <!-- Total Money Card -->
        <div class="card blue">
          <div class="card-header">
            <h3>Total Money</h3>
            <i data-lucide="dollar-sign"></i>
          </div>
          <p class="amount" id="totalAmount">$0.00</p>
          <p class="subtitle">Total paid expenses</p>
        </div>

        <!-- Salary Card -->
        <div class="card green">
          <div class="card-header">
            <h3>Salary</h3>
            <i data-lucide="wallet"></i>
          </div>
          <p class="amount" id="salaryAmount">$0.00</p>
          <p class="subtitle">Total salary received</p>
        </div>

        <!-- Salary in KHR Card -->
        <div class="card purple">
          <div class="card-header">
            <h3>Salary (KHR)</h3>
            <i data-lucide="coins"></i>
          </div>
          <p class="amount" id="salaryKHR">៛0</p>
          <p class="subtitle">Salary in Khmer Riel</p>
        </div>

        <!-- Savings Card -->
        <div class="card amber">
          <div class="card-header">
            <h3>Savings</h3>
            <i data-lucide="piggy-bank"></i>
          </div>
          <p class="amount" id="savingsAmount">$0.00</p>
          <p class="subtitle">Total savings</p>
        </div>
      </div>

      <!-- Date Filter -->
      <div class="filter-section">
        <div class="filter-group">
          <label for="dateFilter">Select Month:</label>
          <select id="dateFilter">
            <option value="all">All Months</option>
          </select>
        </div>
      </div>

      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Date</th>
              <th>Category</th>
              <th>Amount</th>
              <th>Paid</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="expenseTableBody"></tbody>
        </table>
      </div>

      <div class="actions">
        <div class="button-group">
          <button class="btn btn-primary" id="addExpenseBtn">
            <i data-lucide="plus"></i>
            Add Expense
          </button>
          <button class="btn btn-success" id="addSalaryBtn">
            <i data-lucide="wallet"></i>
            Quick Add Salary
          </button>
          <button class="btn btn-secondary" id="printBtn">
            <i data-lucide="printer"></i>
            Print PDF
          </button>
        </div>
        
        <div class="total-display">
          <span>Total Paid Amount:</span>
          <span class="total-amount" id="totalDisplayAmount">$0.00</span>
          <span>USD</span>
        </div>
      </div>

      <!-- Modal -->
      <div id="modal" class="modal">
        <div class="modal-content">
          <h2 id="modalTitle">Add New Expense</h2>
          <form id="expenseForm">
            <div class="form-group">
              <label for="date">Month and Year</label>
              <input type="month" id="date" required>
            </div>
            <div class="form-group">
              <label for="category">Category</label>
              <input type="text" id="category" required>
            </div>
            <div class="form-group">
              <label for="amount">Amount</label>
              <input type="number" id="amount" step="0.01" required>
            </div>
            <div class="form-actions">
              <button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button>
              <button type="submit" class="btn btn-primary" id="submitBtn">Add</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/Transaction.js"></script>
</body>
</html>
